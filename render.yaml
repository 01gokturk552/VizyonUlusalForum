services:
  - type: web
    name: vizyon-ulusal-forum
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/site-data.json
      - key: ALLOWED_ORIGINS
        value: https://vizyonulusalforum.com,https://www.vizyonulusalforum.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
    disk:
      name: forum-data
      mountPath: /var/data
      sizeGB: 1
